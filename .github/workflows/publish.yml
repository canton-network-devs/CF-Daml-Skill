name: Publish to npm

on:
  push:
    tags:
      - "v*" 

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write 

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"
          scope: "@canton-network-devs"

      - name: Install dependencies
        run: npm ci

      - name: Verify skill files
        run: |
          test -f SKILL.md
          test -f references/canton35.md
          test -f references/language.md
          test -f references/patterns.md
          echo "All skill files present ✓"

      - name: Publish
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}